<div class="skill-section-container">
    <mat-icon class="skill-level-icon"> {{ icon }} </mat-icon>
    <div class="skill-level-title-container">
        <span class="skill-level-title">{{ level }}</span>
        <span class="skill-level-description">{{ description }}</span>
    </div>
    <div class="skill-level-container">
        @for (skill of skills; track skill) {
            <span class="skill-item">{{ skill }}</span>
        }
    </div>
</div>
